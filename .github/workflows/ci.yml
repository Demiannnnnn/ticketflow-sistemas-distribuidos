name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [app1/backend, middleware]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Misma versión que las imágenes golang:1.21-alpine de los Dockerfile
          go-version: '1.21'
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build -o /dev/null .
      - name: Tests
        run: go test -race -count=1 ./...

  python:
    name: Python (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [app2, app3]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install -r requirements.txt pytest
      - name: Tests
        run: python -m pytest -v

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [go, python]
    steps:
      - uses: actions/checkout@v7
      - name: Validar docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Build de imágenes de las aplicaciones
        run: |
          docker build -t ticketflow/app1 app1
          docker build -t ticketflow/middleware middleware
          docker build -t ticketflow/app2 app2
          docker build -t ticketflow/app3 app3
